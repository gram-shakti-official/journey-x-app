<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JourneyX | Book Your Ride</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex justify-center">

    <div class="w-full max-w-md bg-white min-h-screen shadow-2xl relative pb-10 font-sans">
        <div class="bg-blue-900 p-6 rounded-b-[40px] text-white shadow-xl text-center">
            <h1 class="text-3xl font-black italic mb-2 tracking-tighter">JOURNEY X</h1>
            <div class="inline-block bg-yellow-400 text-blue-900 px-4 py-1 rounded-full font-black text-sm shadow-lg">
                5.0 ⭐ Premium Service
            </div>
            
            <div class="mt-6 space-y-4 text-left">
                <input id="pickupLoc" type="text" placeholder="Pickup Location" class="w-full p-4 rounded-2xl bg-white/10 border border-white/20 text-white outline-none placeholder-blue-100">
                <input id="dropLoc" type="text" placeholder="Drop Location" class="w-full p-4 rounded-2xl bg-white/10 border border-white/20 text-white outline-none placeholder-blue-100">
                <input id="distance" type="number" oninput="calculateFare()" placeholder="Total KM" class="w-full p-4 rounded-2xl bg-white text-blue-900 font-black text-center outline-none shadow-lg text-2xl">
            </div>
        </div>

        <div class="p-6 space-y-4">
            <div>
                <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Car Category</label>
                <select id="carSelect" onchange="calculateFare()" class="w-full p-4 border-2 border-gray-100 rounded-2xl font-bold bg-gray-50 outline-none">
                    <option value="Mini">Mini (₹9/KM)</option>
                    <option value="Sedan">Sedan (₹12/KM)</option>
                    <option value="Ertiga">Ertiga (₹15/KM)</option>
                    <option value="Innova">Innova Crysta (₹20/KM)</option>
                    <option value="Luxury">Luxury (BMW/Audi) - ₹65/KM</option>
                </select>
            </div>
            <input id="uName" type="text" placeholder="Aapka Naam" class="w-full p-4 border-2 border-gray-100 rounded-2xl outline-none focus:border-blue-900 font-bold">
            <input id="uPhone" type="tel" placeholder="Mobile Number" class="w-full p-4 border-2 border-gray-100 rounded-2xl outline-none focus:border-blue-900 font-bold">

            <div id="totalBox" class="hidden bg-blue-50 border-2 border-blue-100 p-6 rounded-3xl text-center">
                <p class="text-blue-800 text-xs font-bold uppercase tracking-widest">Estimated Fare</p>
                <h2 id="fareAmount" class="text-5xl font-black text-blue-900">₹0</h2>
            </div>

            <button id="bookBtn" onclick="finalSubmit()" class="w-full bg-blue-900 text-white py-5 rounded-2xl font-black text-lg shadow-xl uppercase active:scale-95 transition-all">Confirm Booking</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Aapka Driver App wala Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBJhXPgch_y-k3KxF0m7xT4MCcnO0rAx-8",
            authDomain: "journeyx-new-11d38.firebaseapp.com",
            projectId: "journeyx-new-11d38",
            storageBucket: "journeyx-new-11d38.firebasestorage.app",
            messagingSenderId: "337884382227",
            appId: "1:337884382227:web:018616fbe73a0dfa8babe6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const rates = { "Mini": 9, "Sedan": 12, "Ertiga": 15, "Innova": 20, "Luxury": 65 };

        // Fare Calculation Function
        window.calculateFare = () => {
            const dist = parseFloat(document.getElementById('distance').value) || 0;
            const car = document.getElementById('carSelect').value;
            if(dist > 0) {
                let total = dist * rates[car];
                document.getElementById('fareAmount').innerText = "₹" + Math.round(total);
                document.getElementById('totalBox').classList.remove('hidden');
            }
        };

        // Final Submit to Firebase Firestore
        window.finalSubmit = async () => {
            const name = document.getElementById('uName').value.trim();
            const phone = document.getElementById('uPhone').value.trim();
            const pickup = document.getElementById('pickupLoc').value.trim();
            const drop = document.getElementById('dropLoc').value.trim();
            const dist = document.getElementById('distance').value;
            const car = document.getElementById('carSelect').value;
            const fare = document.getElementById('fareAmount').innerText;

            if(!name || !phone || !pickup || !drop || !dist) {
                alert("Bhai, sari jankari bharna zaroori hai!");
                return;
            }

            const btn = document.getElementById('bookBtn');
            btn.innerText = "Please Wait...";
            btn.disabled = true;

            try {
                // Firebase ki 'bookings' collection mein data save karna
                await addDoc(collection(db, "bookings"), {
                    customer_name: name,
                    customer_phone: phone,
                    pickup: pickup,
                    drop: drop,
                    car_type: car,
                    distance: dist + " KM",
                    fare: fare,
                    status: "pending",
                    time: new Date().toLocaleString()
                });

                alert("✅ Mubarak ho Vikas bhai! Firebase mein booking save ho gayi.");
                location.reload();
            } catch (e) {
                console.error(e);
                alert("Error: " + e.message);
                btn.innerText = "Confirm Booking";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
