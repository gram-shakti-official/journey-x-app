<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JourneyX | Largest Taxi Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .success-popup { animation: slideUp 0.4s ease-out; }
    </style>
</head>
<body class="bg-gray-100 flex justify-center">

    <div class="w-full max-w-md bg-white min-h-screen shadow-2xl relative pb-10 font-sans">
        <div class="bg-blue-900 p-8 rounded-b-[40px] text-white shadow-xl text-center">
            <h1 class="text-4xl font-black italic tracking-tighter uppercase">JOURNEY X</h1>
            <p class="text-[10px] font-bold uppercase tracking-[2px] text-blue-200 mt-2">All India Taxi Service | Largest Taxi Service</p>
            
            <div class="mt-8 space-y-4 text-left">
                <input id="pickupLoc" type="text" placeholder="Pickup Location" class="w-full p-4 rounded-2xl bg-white/10 border border-white/20 text-white outline-none placeholder-blue-100 font-bold">
                <input id="dropLoc" type="text" placeholder="Drop Location" class="w-full p-4 rounded-2xl bg-white/10 border border-white/20 text-white outline-none placeholder-blue-100 font-bold">
                
                <div class="grid grid-cols-2 gap-2">
                    <div class="flex flex-col">
                        <label class="text-[9px] font-bold ml-2 mb-1 text-blue-200">TRAVEL DATE</label>
                        <input id="travelDate" type="date" class="w-full p-4 rounded-2xl bg-white/10 border border-white/20 text-white outline-none font-bold">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-[9px] font-bold ml-2 mb-1 text-blue-200">TRAVEL TIME</label>
                        <input id="travelTime" type="time" class="w-full p-4 rounded-2xl bg-white/10 border border-white/20 text-white outline-none font-bold">
                    </div>
                </div>

                <input id="distance" type="number" oninput="calculateFare()" placeholder="Total KM" class="w-full p-4 rounded-2xl bg-white text-blue-900 font-black text-center outline-none shadow-lg text-2xl">
            </div>
        </div>

        <div class="p-6 space-y-4">
            <select id="carSelect" onchange="calculateFare()" class="w-full p-4 border-2 border-gray-100 rounded-2xl font-bold bg-gray-50 outline-none">
                <option value="Mini">Mini (₹9/KM)</option>
                <option value="Sedan">Sedan (₹12/KM)</option>
                <option value="Ertiga">Ertiga (₹15/KM)</option>
                <option value="Innova">Innova Crysta (₹20/KM)</option>
                <option value="Luxury">Luxury (BMW/Audi) - ₹65/KM</option>
            </select>
            
            <input id="uName" type="text" placeholder="Aapka Naam" class="w-full p-4 border-2 border-gray-100 rounded-2xl outline-none focus:border-blue-900 font-bold">
            
            <div class="relative">
                <input id="uPhone" type="tel" oninput="checkCustomerRating()" placeholder="WhatsApp Number" class="w-full p-4 border-2 border-gray-100 rounded-2xl outline-none focus:border-blue-900 font-bold">
                <div id="userRatingBadge" class="hidden absolute right-3 top-4 bg-yellow-400 text-blue-900 text-[9px] font-black px-2 py-1 rounded-full shadow-sm">
                    Checking...
                </div>
            </div>

            <div id="totalBox" class="hidden bg-blue-50 border-2 border-blue-100 p-6 rounded-3xl text-center">
                <h2 id="fareAmount" class="text-5xl font-black text-blue-900">₹0</h2>
            </div>

            <button id="bookBtn" onclick="finalSubmit()" class="w-full bg-blue-900 text-white py-5 rounded-2xl font-black text-lg shadow-xl uppercase active:scale-95 transition-all">Confirm Booking</button>
        </div>

        <div id="successModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-end sm:items-center justify-center p-4">
            <div class="success-popup bg-white w-full max-w-sm rounded-[40px] p-8 text-center shadow-2xl">
                <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h2 class="text-2xl font-black text-gray-800 mb-2">बुकिंग सफल!</h2>
                <p class="text-gray-500 font-bold text-sm mb-6">Vikas bhai, aapki profile se booking ho gayi hai.</p>
                <button onclick="location.reload()" class="w-full bg-green-600 text-white py-4 rounded-2xl font-black uppercase">OK</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, addDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBJhXPgch_y-k3KxF0m7xT4MCcnO0rAx-8",
            authDomain: "journeyx-new-11d38.firebaseapp.com",
            projectId: "journeyx-new-11d38",
            storageBucket: "journeyx-new-11d38.firebasestorage.app",
            messagingSenderId: "337884382227",
            appId: "1:337884382227:web:018616fbe73a0dfa8babe6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ✅ पेज लोड होते ही आज की तारीख और समय डालना
        window.onload = () => {
            const now = new Date();
            
            // तारीख सेट करना (YYYY-MM-DD फॉर्मेट)
            const today = now.toISOString().split('T')[0];
            document.getElementById('travelDate').value = today;

            // समय सेट करना (HH:MM फॉर्मेट)
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('travelTime').value = hours + ":" + minutes;
        };

        const rates = { "Mini": 9, "Sedan": 12, "Ertiga": 15, "Innova": 20, "Luxury": 65 };

        window.calculateFare = () => {
            const dist = parseFloat(document.getElementById('distance').value) || 0;
            const car = document.getElementById('carSelect').value;
            if(dist > 0) {
                let total = dist * rates[car];
                document.getElementById('fareAmount').innerText = "₹" + Math.round(total);
                document.getElementById('totalBox').classList.remove('hidden');
            }
        };

        window.checkCustomerRating = async () => {
            const phone = document.getElementById('uPhone').value.trim();
            const badge = document.getElementById('userRatingBadge');
            if(phone.length >= 10) {
                badge.classList.remove('hidden');
                try {
                    const docRef = doc(db, "customers", phone);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        badge.innerText = (docSnap.data().rating || "5.0") + " ⭐ Profile";
                    } else {
                        badge.innerText = "5.0 ⭐ New Profile";
                    }
                } catch(e) { console.log(e); }
            } else { badge.classList.add('hidden'); }
        };

        window.finalSubmit = async () => {
            const name = document.getElementById('uName').value.trim();
            const phone = document.getElementById('uPhone').value.trim();
            const pickup = document.getElementById('pickupLoc').value.trim();
            const drop = document.getElementById('dropLoc').value.trim();
            const date = document.getElementById('travelDate').value;
            const time = document.getElementById('travelTime').value;
            const dist = document.getElementById('distance').value;
            const car = document.getElementById('carSelect').value;
            const fare = document.getElementById('fareAmount').innerText;

            if(!name || !phone) return alert("Bhai, Naam aur Number bharna zaroori hai!");

            const btn = document.getElementById('bookBtn');
            btn.innerText = "Booking...";
            btn.disabled = true;

            try {
                await addDoc(collection(db, "bookings"), {
                    customer_name: name, customer_phone: phone, pickup, drop,
                    travel_date: date, travel_time: time, car_type: car,
                    distance: dist + " KM", fare: fare, status: "pending",
                    booked_at: new Date().toLocaleString()
                });
                await setDoc(doc(db, "customers", phone), { name, phone }, { merge: true });
                document.getElementById('successModal').classList.remove('hidden');
            } catch (e) {
                alert("Error: " + e.message);
                btn.innerText = "Confirm Booking";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
