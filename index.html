<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JourneyX | Premium Taxi Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .selected-tab { border: 2px solid white !important; border-radius: 9999px; background: rgba(255, 255, 255, 0.15); }
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    </style>

    <script>
        // --- सुपबेस सेटअप ---
        const SUPABASE_URL = "https://tqpmmqzdlttlgduykbw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_vEJyQPNgldCwal0Syx2ApA__00e0lcK"; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let userRating = 5.0; // यहाँ ग्राहक की रेटिंग है
        const rates = { "Mini": 9, "Sedan": 12, "Ertiga": 15, "Innova": 20, "Luxury": 65 };

        window.onload = () => {
            filterLuxuryCars();
        };

        // --- रेटिंग के हिसाब से गाड़ी छुपाने का लॉजिक ---
        function filterLuxuryCars() {
            const carSelect = document.getElementById('carSelect');
            const ratingDisplay = document.getElementById('displayRating');
            ratingDisplay.innerText = userRating.toFixed(1) + " ⭐";

            if (userRating < 4.5) {
                ratingDisplay.style.backgroundColor = "#ef4444"; // लाल रंग
                for (let i = 0; i < carSelect.options.length; i++) {
                    if (carSelect.options[i].value === "Luxury" || carSelect.options[i].value === "Innova") {
                        carSelect.options[i].style.display = "none";
                    }
                }
            }
        }

        function calculateFare() {
            const dist = parseFloat(document.getElementById('distance').value) || 0;
            const car = document.getElementById('carSelect').value;
            if(dist > 0) {
                let total = dist * rates[car];
                document.getElementById('fareAmount').innerText = "₹" + Math.round(total);
                document.getElementById('totalBox').classList.remove('hidden');
            }
        }

        async function finalSubmit() {
            const name = document.getElementById('uName').value;
            const phone = document.getElementById('uPhone').value;
            const dist = document.getElementById('distance').value;
            const car = document.getElementById('carSelect').value;
            const fare = document.getElementById('fareAmount').innerText;

            if(!name || !phone || !dist) { alert("कृपया पूरी जानकारी भरें!"); return; }

            const { error } = await _supabase.from('bookings').insert([{
                customer_name: name,
                customer_phone: phone,
                vehicle_type: car,
                fuel_type: "Rating: " + userRating,
                luggage_details: "Fare: " + fare + " | KM: " + dist,
                status: 'pending'
            }]);

            if (!error) {
                alert("✅ बुकिंग सफल रही!");
                location.reload();
            } else {
                alert("❌ एरर: डेटा सेव नहीं हुआ।");
            }
        }
    </script>
</head>
<body class="bg-slate-100 flex justify-center">

    <div class="w-full max-w-md bg-white min-h-screen shadow-2xl relative pb-10 font-sans">
        <div class="bg-[#1e3a8a] p-6 rounded-b-[40px] text-white shadow-xl text-center">
            <h1 class="text-3xl font-black italic mb-2 tracking-tighter">JOURNEY X</h1>
            <div id="displayRating" class="inline-block bg-yellow-400 text-blue-900 px-4 py-1 rounded-full font-black text-sm shadow-lg">
                5.0 ⭐
            </div>
            
            <div class="mt-6 space-y-4 text-left">
                <input id="pickupLoc" type="text" placeholder="Pickup Location" class="w-full p-4 rounded-2xl bg-white/10 border border-white/20 text-white outline-none placeholder-blue-200">
                <input id="dropLoc" type="text" placeholder="Drop Location" class="w-full p-4 rounded-2xl bg-white/10 border border-white/20 text-white outline-none placeholder-blue-200">
                <input id="distance" type="number" oninput="calculateFare()" placeholder="Total KM" class="w-full p-4 rounded-2xl bg-white text-blue-900 font-black text-center outline-none shadow-lg text-2xl">
            </div>
        </div>

        <div class="p-6 space-y-4">
            <div>
                <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Car Category</label>
                <select id="carSelect" onchange="calculateFare()" class="w-full p-4 border-2 border-gray-100 rounded-2xl font-bold bg-gray-50 outline-none">
                    <option value="Mini">Mini (₹9/KM)</option>
                    <option value="Sedan">Sedan (₹12/KM)</option>
                    <option value="Ertiga">Ertiga (₹15/KM)</option>
                    <option value="Innova">Innova Crysta (₹20/KM)</option>
                    <option value="Luxury">Luxury (BMW/Audi) - ₹65/KM</option>
                </select>
            </div>
            <input id="uName" type="text" placeholder="Full Name" class="w-full p-4 border-2 border-gray-100 rounded-2xl outline-none focus:border-blue-900">
            <input id="uPhone" type="tel" placeholder="Mobile Number" class="w-full p-4 border-2 border-gray-100 rounded-2xl outline-none focus:border-blue-900">

            <div id="totalBox" class="hidden bg-blue-50 border-2 border-blue-100 p-6 rounded-3xl text-center">
                <p class="text-blue-800 text-xs font-bold uppercase tracking-widest">Estimated Fare</p>
                <h2 id="fareAmount" class="text-5xl font-black text-blue-900">₹0</h2>
            </div>

            <button onclick="finalSubmit()" class="w-full bg-[#1e3a8a] text-white py-5 rounded-2xl font-black text-lg shadow-xl uppercase active:scale-95 transition-all">Confirm Booking</button>
        </div>
    </div>
</body>
</html>
